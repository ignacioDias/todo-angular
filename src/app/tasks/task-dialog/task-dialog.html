<dialog
  #taskDialog
  class="task-dialog"
  [attr.aria-label]="isEditing() ? 'Editar tarea' : 'Nueva tarea'"
  (close)="onDialogClose()"
  (click)="onBackdropClick($event)"
>
  <div class="dialog-content">
    <header class="dialog-header">
      <h2>{{ isEditing() ? 'Editar tarea' : 'Nueva tarea' }}</h2>
      <button type="button" class="dialog-close" aria-label="Cerrar" (click)="close()">
        &times;
      </button>
    </header>

    <form class="task-form" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <label class="field field-wide">
        <span class="field-label">Título</span>
        <input type="text" formControlName="title" autofocus />
      </label>

      <label class="field field-wide">
        <span class="field-label">Descripción</span>
        <input type="text" formControlName="description" />
      </label>

      <label class="field">
        <span class="field-label">ID</span>
        <input type="number" formControlName="id" [readonly]="isEditing()" />
      </label>

      <label class="field">
        <span class="field-label">Prioridad</span>
        <select formControlName="priority">
          <option value="" disabled>Selecciona una prioridad</option>
          <option value="low">Baja</option>
          <option value="medium">Media</option>
          <option value="high">Alta</option>
        </select>
      </label>

      @if (submitAttempted() && taskForm.invalid) {
        <p class="form-error" role="alert">Completa todos los campos obligatorios.</p>
      }

      <div class="dialog-actions">
        <button type="button" class="secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="primary">
          {{ isEditing() ? 'Guardar cambios' : 'Crear tarea' }}
        </button>
      </div>
    </form>
  </div>
</dialog>
