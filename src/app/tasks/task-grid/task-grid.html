<div class="task-grid">
  @for (task of tasks().entries(); track task[0]) {
    <app-task-card [task]="task[1]" (edit)="onEditTask($event)" />
  } @empty {
     <div class="empty-state">
        <h3>No tasks</h3>
        <p>Create tasks to get started.</p>
      </div>
  }
</div>

<app-task-dialog
  [open]="editDialogOpen()"
  [task]="editingTask()"
  (openChange)="onEditDialogOpenChange($event)"
  (saved)="onTaskSaved($event)"
/>
