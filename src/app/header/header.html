<div role="toolbar" class="toolbar">
  <button
    type="button"
    class="new-task"
    aria-haspopup="dialog"
    (click)="openTaskDialog()"
  >
    Crear Tarea
  </button>
  <button type="button" class="delete-tasks">Eliminar Tareas</button>
</div>

<app-task-dialog
  [open]="isDialogOpen()"
  (openChange)="isDialogOpen.set($event)"
  (saved)="onTaskSaved($event)"
/>
