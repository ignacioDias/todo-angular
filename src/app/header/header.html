<div role="toolbar" class="toolbar" aria-label="Acciones de la aplicación">
  <button
    type="button"
    class="new-task"
    aria-haspopup="dialog"
    (click)="openTaskDialog()"
  >
    Crear Tarea
  </button>
  <button type="button" class="delete-tasks">Eliminar Tareas</button>
  <button
    type="button"
    class="theme-toggle"
    [attr.aria-label]="themeStore.isDark() ? 'Activar modo claro' : 'Activar modo oscuro'"
    (click)="toggleTheme()"
  >
    <mat-icon aria-hidden="true">{{ themeStore.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</div>

<app-task-dialog
  [open]="isDialogOpen()"
  (openChange)="isDialogOpen.set($event)"
  (saved)="onTaskSaved($event)"
/>
